name: CI

on:
  push:
    branches: [main]
    tags: ['v*', '[0-9]*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build FidoManager.slnx -c Release

      - name: Test
        run: dotnet test FidoManager.slnx -c Release --no-build

  release:
    name: Publish, package & release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      PUBLISH_DIR: src/Fido2.Manager/bin/x64/Release/net10.0-windows10.0.19041.0/win-x64/publish
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Read version from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Publish (x64, NativeAOT single-file)
        run: >
          dotnet publish src/Fido2.Manager/Fido2.Manager.csproj
          -c Release -p:Platform=x64 -r win-x64
          -p:Version=$env:VERSION

      - name: Pack portable zip
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $stage = "dist/portable"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "$env:PUBLISH_DIR/*" $stage -Recurse -Exclude *.pdb
          Compress-Archive -Path "$stage/*" `
            -DestinationPath "dist/FIDO2.Manager-$env:VERSION-win-x64.zip"
          Remove-Item $stage -Recurse -Force

      - name: Build installer (Inno Setup)
        run: iscc packaging/installer.iss /DAppVersion=$env:VERSION /Odist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.zip
            dist/*-setup.exe
          generate_release_notes: true
